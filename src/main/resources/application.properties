# HTTP
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# inexogy (formerly Discovergy) account - set via environment variables
# DISCOVERGY_EMAIL, DISCOVERGY_PASSWORD and DISCOVERGY_CLIENTID
#discovergy.email=
#discovergy.password=
#discovergy.clientid=

# API (can be overridden via DISCOVERGY_BASE_URL etc.)
discovergy.base-url=https://api.inexogy.com/public/v1
discovergy.timeout=PT15S
discovergy.token-lifetime=PT24H

# Native image needs TLS for the HTTPS calls to the API
quarkus.ssl.native=true

# Logging (set QUARKUS_LOG_CATEGORY__ROCKS_KONRATH__LEVEL=DEBUG for request details)
quarkus.log.category."rocks.konrath".level=INFO
